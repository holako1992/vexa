# Hot-reload dev override — bind-mount host source + reload commands so an edit reflects
# LIVE with NO rebuild / PR / gates / merge. The images already carry the deps; we just run
# the shipped source from a bind mount under a file-watching server.
#
#   HOT UP:   IMAGE_TAG=fixdev docker compose -p eyeball-compose -f docker-compose.yml -f docker-compose.hot.yml up -d <svc>
#   REVERT:   IMAGE_TAG=fixdev docker compose -p eyeball-compose up -d <svc>   # drops override → back to the built image
#
# Edit files under ~/eyeball/vexa/{core,clients} → change is live in seconds.
# --timeout-graceful-shutdown: a hot-reload's OLD process waits for in-flight connections to drain
# before the new one binds — long-lived SSE (chat / meeting stream / admin) NEVER drains on its own,
# so a reload could wedge the service until a manual restart (agent-api down 8.5 min, 2026-07-08
# incident). Bound the wait: 10s is one SSE ping interval short — clients reconnect gaplessly
# (Last-Event-ID resume) the moment the new process binds.
services:
  meeting-api:
    command: ["uvicorn","meeting_api.__main__:app","--host","0.0.0.0","--port","8080","--reload","--reload-dir","/app/src","--timeout-graceful-shutdown","10"]
    volumes:
      - ../../core/meetings/services/meeting-api/src:/app/src

  agent-api:
    command: ["uvicorn","control_plane.api:app","--host","0.0.0.0","--port","8100","--reload","--reload-dir","/app/control_plane","--reload-dir","/app/shared","--timeout-graceful-shutdown","10"]
    volumes:
      - ../../core/agent/control_plane:/app/control_plane
      - ../../core/agent/shared:/app/shared

  runtime:
    command: ["uvicorn","runtime_kernel.api:app","--host","0.0.0.0","--port","8090","--reload","--reload-dir","/app/src","--timeout-graceful-shutdown","10"]
    volumes:
      - ../../core/runtime/src:/app/src

  terminal:
    command: ["node","server.mjs"]
    environment:
      - NODE_ENV=development
      # Inherit the public origin from .env (e.g. https://terminal.dev.vexa.ai on the
      # served eyeball); fall back to localhost only for a local-tunnel dev loop.
      # A hardcoded localhost here breaks NextAuth sign-in for any publicly-served host.
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:15300}
    volumes:
      - ../../clients/terminal/src:/app/src
      - ../../clients/terminal/public:/app/public
      - ../../clients/terminal/next.config.ts:/app/next.config.ts
      - ../../clients/terminal/tsconfig.json:/app/tsconfig.json

  # The dashboard has no custom server (next start / next dev are the whole story), so hot reload
  # is `next dev` itself rather than a --reload flag on a hand-rolled process. Its Dockerfile ships
  # PRUNED PRODUCTION deps (RUNTIME_DEPS=prod default) — `next dev` needs the dev toolchain
  # (@types/*, tailwind/postcss) at runtime, so a host running this overlay must build the image
  # with RUNTIME_DEPS=dev (DASHBOARD_NEXT_RUNTIME_DEPS=dev in .env) or `next dev` boots empty-handed
  # and npm-installs the missing deps over the network at request time.
  dashboard-next:
    command: ["npx","next","dev","--port","3001","--hostname","0.0.0.0"]
    environment:
      - NODE_ENV=development
      # Inherit the public origin from .env; fall back to this overlay's own compose port
      # (13002) rather than the terminal's, since a hardcoded wrong origin breaks NextAuth sign-in.
      - NEXTAUTH_URL=${DASHBOARD_NEXT_URL:-http://localhost:13002}
    volumes:
      - ../../clients/dashboard/src:/app/src
      - ../../clients/dashboard/next.config.ts:/app/next.config.ts
      - ../../clients/dashboard/tsconfig.json:/app/tsconfig.json
